name: .NET CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore git_actions_test.slnx

    - name: Build solution
      run: dotnet build git_actions_test.slnx --no-restore --configuration Release

    - name: Run unit tests
      run: dotnet test git_actions_test.slnx --no-build --configuration Release --verbosity normal
